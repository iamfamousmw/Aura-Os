name: Build Aura OS from Scratch
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses-dev bc cpio unzip rsync python3
      - name: Clone Buildroot
        run: |
          git clone https://github.com/buildroot/buildroot --depth 1
          ls ../
          ls ../aura-os || ls .
      - name: Build ISO from Scratch
        run: |
          cd buildroot
          make BR2_EXTERNAL=$GITHUB_WORKSPACE aura_defconfig
          make -j$(nproc)
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-ISO
          path: buildroot/output/images/*.iso
